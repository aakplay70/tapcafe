<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FFDCE8">
<title>Tap Café</title>
<script>
  // One official link: the GitHub Pages copy forwards to the Firebase site.
  if (/\.github\.io$/.test(location.hostname)) location.replace('https://tapcafe-game.web.app/');
</script>
<meta name="description" content="A cute two-minute boba shop game. Same customers for everyone each day. Order up! Can you beat me?">
<link rel="canonical" href="https://tapcafe-game.web.app/">
<link rel="icon" type="image/png" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tap Café">
<meta property="og:title" content="Tap Café — Order up!">
<meta property="og:description" content="A cute two-minute boba shop game. Same customers for everyone each day. Can you beat me?">
<meta property="og:url" content="https://tapcafe-game.web.app/">
<meta property="og:image" content="https://tapcafe-game.web.app/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-round" id="hudRound">Round 1/3</div>
    <div class="hud-timer"><div class="tbar"><i id="tbar"></i></div><span id="hudTime">25</span></div>
    <div class="hud-cash" id="hudCash">$0</div>
    <button id="pause" type="button" aria-label="Pause">⏸</button>
    <button id="mute" type="button" aria-label="Sound on or off">🔊</button>
  </header>

  <section id="shop">
    <div class="slot" data-slot="0"></div>
    <div class="slot" data-slot="1"></div>
    <div class="slot" data-slot="2"></div>
    <div id="counter"></div>
  </section>

  <section id="work">
    <div class="cuprow">
      <div id="ups"></div>
      <div id="cup"></div>
      <button id="toss" type="button" aria-label="Toss the cup">Toss</button>
    </div>
    <div class="btnrow" id="drinks"></div>
    <div class="btnrow" id="tops"></div>
  </section>

  <div id="banner" hidden></div>
  <div id="hand" hidden>👆</div>
  <div id="overlay" hidden></div>
</div>
<script src="js/analytics.js"></script>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/share.js"></script>
<script src="js/game.js"></script>
</body>
</html>
