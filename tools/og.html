<!doctype html>
<!-- Source for img/og.png (link preview) and img/icon.png. Rendered with a headless browser; see README. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { font-family: "Fredoka", "Segoe UI", sans-serif; color: #4A2B3D; overflow: hidden; }
  .og { width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: radial-gradient(circle at 30px 30px, rgba(255,255,255,.55) 7px, transparent 8px) 0 0 / 60px 60px, linear-gradient(#FFDCE8, #FFC2D6); }
  .logo { position: absolute; left: 70px; top: 120px; font-size: 150px; font-weight: 700; line-height: 1; color: #F7A8C0;
    -webkit-text-stroke: 7px #4A2B3D; paint-order: stroke fill; text-shadow: 0 10px 0 #4A2B3D; }
  .tag { position: absolute; left: 76px; top: 300px; font-size: 46px; font-weight: 600; }
  .chip { position: absolute; left: 76px; top: 380px; font-size: 34px; font-weight: 600; background: #BDEBDD; border: 5px solid #4A2B3D; border-radius: 40px; padding: 8px 28px; }
  .people { position: absolute; right: 10px; bottom: 60px; display: flex; }
  .people svg { width: 250px; height: 312px; margin-left: -70px; }
  .counter { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #BDEBDD; border-top: 6px solid #4A2B3D; box-shadow: inset 0 18px 0 rgba(255,255,255,.55); }
  .cup { position: absolute; left: 520px; bottom: 50px; width: 150px; height: 180px; }
  .icon { width: 512px; height: 512px; background: linear-gradient(#FFDCE8, #FFC2D6); display: flex; align-items: center; justify-content: center; }
  .icon svg { width: 380px; height: 456px; }
</style></head>
<body>
<div id="root"></div>
<script src="../js/core.js"></script>
<script>
  const icon = location.hash === '#icon';
  const root = document.getElementById('root');
  if (icon) {
    root.innerHTML = '<div class="icon">' + TC.cupSVG('taro', ['pearls'], 1) + '</div>';
  } else {
    const d = TC.buildDaily('2026-11-11');
    root.innerHTML = '<div class="og"><div class="logo">Tap Café</div><div class="tag">Order up! Can you beat me?</div>' +
      '<div class="chip">A two-minute boba shop game</div>' +
      '<div class="people">' + d.rounds[0].slice(0, 3).map((c) => TC.customerSVG(c.look, 0)).join('') + '</div>' +
      '<div class="counter"></div><div class="cup">' + TC.cupSVG('mango', ['pearls', 'jelly'], 1) + '</div></div>';
  }
</script>
</body></html>
